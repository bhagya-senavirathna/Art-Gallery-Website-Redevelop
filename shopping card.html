<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="shopping card.css">
</head>
<body>
    
  <div class="cart-container">
    <h1>Shopping Cart</h1>
    <div class="cart-header">
      <span>Product</span>
      <span>Quantity</span>
      <span>Price</span>
      <span>Total</span>
    </div>
    <div class="cart-item">
      <div class="product-details">
       
        <img src="d:\New folder (2)\arts\Art 3.jpeg"alt="Product Image">
        <span>Example Product</span>
      </div>
      <div class="quantity">
        <button class="btn-decrease">-</button>
        <input type="number" value="1" min="1">
        <button class="btn-increase">+</button>
      </div>
      <span class="price">RS.12000.00</span>
      <span class="total-price">RS.12000.00</span>
    </div>
    <div class="cart-item">
      <div class="product-details">
       
        <img src="d:\New folder (2)\arts\Art 2.jpeg"alt="Product Image">
        <span>Example Product</span>
      </div>
      <div class="quantity">
        <button class="btn-decrease">-</button>
        <input type="number" value="1" min="1">
        <button class="btn-increase">+</button>
      </div>
      <span class="price">RS.10000.00</span>
      <span class="total-price">RS.10000.00</span>
    </div>
    <div class="cart-item">
      <div class="product-details">
       
        <img src="D:\New folder (2)\arts\Art 1.jpeg" alt="Product Image">
        <span>Example Product</span>
      </div>
      <div class="quantity">
        <button class="btn-decrease">-</button>
        <input type="number" value="1" min="1">
        <button class="btn-increase">+</button>
      </div>
      <span class="price">RS.20000.00</span>
      <span class="total-price">RS.20000.00</span>
    </div>
    <div class="cart-footer">
      <button class="btn-clear">Clear Cart</button>
      <div class="cart-total">
        <span>Total:</span>
        <span class="grand-total">RS.42000.00</span>
      </div>
      <button class="btn-checkout">Checkout</button>
    </div>
    
    </div>
  </div>
</body>
</html>
